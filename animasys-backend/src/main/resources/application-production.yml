# Production profile — AI mock mode forbidden. GEMINI_API_KEY is optional; if unset,
# AI endpoints fail at call time (see AiStartupValidator) but the app still boots.
app:
  ai:
    mock-enabled: false

logging:
  level:
    root: WARN
    com.animasys: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
  file:
    name: ${LOG_FILE:./logs/animasys-backend.log}
