services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      MYSQL_DATABASE: animasys_erp
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"

  backend:
    build:
      context: ..
      dockerfile: animasys-backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # "file-logging" opts into the JSON_FILE appender (see logback-spring.xml) —
      # safe here because the backend-logs volume below gives it somewhere to write.
      SPRING_PROFILES_ACTIVE: production,file-logging
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/animasys_erp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?set SPRING_DATASOURCE_PASSWORD in .env}
      # Required — see JwtTokenProvider startup validation. Must be a unique,
      # random, >=32 char secret. Generate with: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MOCK_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - backend-logs:/app/logs

volumes:
  mysql-data:
  backend-logs:
